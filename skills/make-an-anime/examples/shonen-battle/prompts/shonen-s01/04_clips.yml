# Green-screen performances: H3 with a locked camera, keyed to transparent PNG sequences. audio: <cast id> pins that
# character's mouth track, audio_at: the scene second the clip starts at, so frame i is scene time audio_at + i/24.
- name: kaen
  image: kaen-green
  seconds: 5
  frames: 120
  audio: kaen
  audio_at: 2.0
  key: green
  low: 8   # the flames light the green, and that glow must key out too
  prompt: >-
    {{STYLE}} The same man as in the image, on-model, alone. 0-2.8 s: he holds his stance with his mouth closed, breathing hard, flames around his fist growing. 2.8-4.4 s: he shouts his line with clear mouth movements while throwing a full-body lunging punch to the right. 4.4-5 s: he holds the punch, straining, hair and sash whipping. His whole body stays inside the frame. The flat green background stays one flat colour, no floor, no shadow, no green on him. No text, no extra people.
  camera:
    move: locked-off, the camera does not move at all
- name: arashi
  image: arashi-green
  seconds: 5
  frames: 120
  audio: arashi
  audio_at: 2.0
  key: green
  prompt: >-
    {{STYLE}} The same woman as in the image, on-model, alone. 0.3-2.7 s: she speaks her line coldly with clear mouth movements, chin raised, lightning crackling around her hand. 2.7-3.3 s: she closes her mouth and narrows her eyes, coiling back. 3.3-5 s: she drives her open hand forward to the left with lightning bursting from it, coat and ponytail whipping. Her hair stays silver-white and her coat stays indigo, with the same flat colours and exposure in every frame; the lightning does not relight or darken her. Her whole body stays inside the frame. The flat green background stays one flat colour, no floor, no shadow, no green on her. No text, no extra people.
  camera:
    move: locked-off, the camera does not move at all
