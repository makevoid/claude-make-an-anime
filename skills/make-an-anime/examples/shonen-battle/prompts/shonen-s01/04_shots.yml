# 288 frames: title 48, composite 120, full H3 120.
- name: title
  color: "#05060d"
  frames: 48
# The layered section's background: H3 animates the empty arena, and `roll` turns the plate locally. p5 draws the two
# keyed fighters over it inside Anim.withRoll, so they turn with it (05_overlay.js).
- name: composite-plate
  image: arena-plate
  frames: 120
  roll: [-9, 9]
  prompt: >-
    {{STYLE}} The same empty arena as in the image. ONE CONTINUOUS TAKE with no cuts. Clouds race across the sky, chunks of rock drift and slowly tumble, lightning flashes inside the storm on the right, embers and dust blow across the stone floor, the sunset light flickers. No people or characters ever appear. No text, no new objects, no scene change.
  camera:
    move: fast continuous orbit to the right around the centre of the arena
    from: low wide view, floor in the lower third, sunset on the left, storm on the right
    to: the same low wide view rotated about 40 degrees around the arena, pillars passing in the foreground
    timing: moving from the first frame to the last, no hold
    anchors: horizon stays in frame, the arena centre stays near the middle of the frame
# No layers: everything in one H3 take.
- name: full-h3
  image: clash
  frames: 120
  prompt: >-
    {{STYLE}} The same man and woman as in the image, on-model, same faces and outfits. ONE CONTINUOUS TAKE with no cuts and no change of shot. 0-1 s: they break apart from the collision, he roars with his mouth wide open. 1-2.5 s: he drives a huge blast of orange fire forward with his fist. 2.5-3.5 s: she shouts with her mouth open and slashes her hand through the air, a wall of blue-white lightning splitting his fire. 3.5-5 s: fire and lightning crash together in a shockwave, both fighters flying through the sparks. Faces stay on-model, the arena and sky stay the same place. No text, no extra people, no new objects.
  camera:
    move: very fast 180 degree orbit around the two fighters, one unbroken move, the camera circles them
    from: slightly low two-shot, the man on the left and the woman on the right
    to: the opposite side of the two fighters, the woman now on the left and the man on the right, sky rotated behind them
    timing: starts immediately, accelerates through the middle, settles for the last half second
    anchors: both fighters stay in frame the whole time, centred on the point between them
