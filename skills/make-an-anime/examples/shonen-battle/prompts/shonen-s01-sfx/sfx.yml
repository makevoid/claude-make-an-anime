# Effects over the finished scene, in scene seconds. Levels are relative to the mix under each cue.
source: output/shonen-s01/final_overlay.mp4
out: output/shonen-s01/final_sfx.mp4
rel_db: -6
peak_db: -3
max_gain_db: 18
voice_dip_db: 5
sounds:
  slam: {prompt: "One enormous deep cinematic impact boom with a metallic ring, isolated, no music, no voices", duration: 3, seed: 11}
  wind: {prompt: "Strong high-altitude wind and distant rolling thunder, steady ambience, no music, no voices", duration: 10, seed: 12}
  whoosh: {prompt: "One very fast sharp anime sword whoosh, isolated, no music, no voices", duration: 1, seed: 13}
  clash: {prompt: "A massive anime punch collision, explosive crack and shockwave with electric sparks, isolated, no music, no voices", duration: 3, seed: 14}
  fire: {prompt: "A huge roaring burst of flame, isolated, no music, no voices", duration: 3, seed: 15}
  bolt: {prompt: "A sharp close lightning strike crack, isolated, no music, no voices", duration: 2, seed: 16}
cues:
  - {at: 0.10, sound: slam, rel_db: 2, len: 1.8, fade: 0.3}
  - {at: 1.80, sound: whoosh, rel_db: -2, len: 0.4, fade: 0.05}
  - {at: 2.00, sound: wind, rel_db: -12, len: 10.0, fade: 0.6}
  - {at: 3.30, sound: bolt, rel_db: -9, len: 1.2, fade: 0.3}
  - {at: 5.05, sound: whoosh, rel_db: -2, len: 0.55, fade: 0.05}
  - {at: 5.60, sound: clash, rel_db: 3, len: 1.3, fade: 0.3}
  - {at: 6.85, sound: whoosh, rel_db: -3, len: 0.4, fade: 0.05}
  - {at: 7.90, sound: fire, rel_db: -3, len: 1.6, fade: 0.4}
  - {at: 9.95, sound: bolt, rel_db: -2, len: 1.3, fade: 0.3}
  - {at: 10.70, sound: clash, rel_db: 1, len: 1.3, fade: 0.35}
